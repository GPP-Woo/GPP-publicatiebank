# Run quality control on the (generated) Open API specification.

name: OpenAPI specification checks

on:
  push:
    branches:
      - main
      - stable/*
  pull_request:
  workflow_dispatch:

# least privilege as default, should be overridden per job if necessary
permissions:
  contents: read

jobs:
  oas:
    name: Checks

    strategy:
      matrix:
        component:
          - application
          - reuse

    uses: maykinmedia/open-api-workflows/.github/workflows/oas.yml@v6
    with:
      python-version: '3.12'
      django-settings-module: woo_publications.conf.ci
      oas-generate-command: >2
        bin/generate_api_schema.sh ${{ matrix.component }}
        src/woo_publications/api/${{ matrix.component }}_api/openapi.yaml
      schema-path: src/woo_publications/api/${{ matrix.component }}_api/openapi.yaml
      oas-artifact-name: ${{ matrix.component }}-api-oas
      node-version-file: '.nvmrc'
      spectral-version: '^6.15.0'
      openapi-to-postman-version: '^5.0.0'
      postman-artifact-name: gpp-publicatiebank-postman-collection
      openapi-generator-version: '^2.20.0'
